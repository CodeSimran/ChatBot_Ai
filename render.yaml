services:
  - type: web
    name: chatbot-backend
    runtime: docker
    rootDir: chatbot-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/chat
    envVars:
      - key: AI_PROVIDER
        value: NVIDIA
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant

  - type: web
    name: chatbot-frontend
    runtime: static
    rootDir: chatbot-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://chatbot-backend.onrender.com