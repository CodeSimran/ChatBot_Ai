ai:
  provider: ${AI_PROVIDER:NVIDIA}

nvidia:
  api:
    key: ${NVIDIA_API_KEY:}
    model: ${NVIDIA_MODEL:openai/gpt-oss-20b}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

groq:
  api:
    key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.1-8b-instant}

server:
  port: ${PORT:8080}
